# Pinned shared toolchains for /opt/tooling (README.md). mise.lock records the
# resolved artifacts and their checksums; install.sh refuses anything it doesn't cover.
[settings]
lockfile = true

[tools]
uv = "0.12.13"
sccache = "0.17.0"
go = "1.27.1"
rust = { version = "1.98.1", profile = "default" }
"aqua:neovim/neovim" = "0.12.5"
